[package]
name = "lustpress"
version = "9.1.10"
edition = "2024"
rust-version = "1.96.0"
authors = ["sinkaroid"]
license = "MIT"
description = "Unified REST + GraphQL API for PornHub and other R18 websites"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
# Web framework
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5" }
tower-http = { version = "0.7", features = ["cors", "trace", "timeout"] }

# HTTP client with native TLS and compression (matching jandapress)
reqwest = { version = "0.13", features = ["json", "gzip", "deflate"] }

# HTML scraping & Regex
scraper = "0.29"
regex = "1"

# Serialization & JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# In-memory Cache & Redis
moka = { version = "0.12", features = ["future"] }
deadpool-redis = "0.23"
flate2 = "1.0"

# GraphQL
async-graphql = { version = "7", features = ["chrono"] }
async-graphql-axum = "7"

# Observability & Metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6.0"
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk"] }


# Error Handling & Utilities
thiserror = "2"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio-test = "0.4"
temp-env = { version = "0.3", features = ["async_closure"] }
