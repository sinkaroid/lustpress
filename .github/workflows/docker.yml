name: Docker

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set image metadata
        id: meta
        shell: bash
        run: |
          echo "image_name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "owner_lower=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "image_tag=$(grep -m1 '^version =' Cargo.toml | cut -d '"' -f2)" >> "$GITHUB_OUTPUT"
          echo "image_sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log into GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (PR validation)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          pull: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.image_tag }}

      - name: Build Redis image (PR validation)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./redis
          file: ./redis/Dockerfile
          push: false
          pull: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ghcr.io/${{ steps.meta.outputs.owner_lower }}/lustpress-redis:${{ steps.meta.outputs.image_tag }}

      - name: Build and push Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          pull: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.image_tag }}
            ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.image_sha }}
            ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.short_sha }}
            ${{ steps.meta.outputs.image_name }}:latest

      - name: Build and push Redis image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./redis
          file: ./redis/Dockerfile
          push: true
          pull: true
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner_lower }}/lustpress-redis:${{ steps.meta.outputs.image_tag }}
            ghcr.io/${{ steps.meta.outputs.owner_lower }}/lustpress-redis:${{ steps.meta.outputs.image_sha }}
            ghcr.io/${{ steps.meta.outputs.owner_lower }}/lustpress-redis:${{ steps.meta.outputs.short_sha }}
            ghcr.io/${{ steps.meta.outputs.owner_lower }}/lustpress-redis:latest