name: Check status

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build binary
        run: cargo build

      - name: Run server and test endpoints
        run: |
          ./target/debug/lustpress &
          for i in {1..30}; do
            curl -s http://127.0.0.1:3000/ > /dev/null && break
            sleep 1
          done
          curl -f -s http://127.0.0.1:3000/ | grep '"success":true'
          curl -f -s http://127.0.0.1:3000/metrics | grep 'http_requests_total'
          curl -f -s http://127.0.0.1:3000/docs/json | grep '"openapi": "3.0.3"'