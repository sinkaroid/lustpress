name: Eporner test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build binary
        run: cargo build

      - name: Run server and test eporner
        run: |
          ./target/debug/lustpress &
          for i in {1..30}; do
            curl -s http://127.0.0.1:3000/ > /dev/null && break
            sleep 1
          done
          RESPONSE=$(curl -s "http://127.0.0.1:3000/eporner/search?key=cosplay")
          echo "Response: $RESPONSE"
          echo "$RESPONSE" | grep '"success":true'